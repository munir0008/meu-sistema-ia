# Blueprint de deploy do backend no Render (https://render.com/docs/blueprint-spec).
# Uso: Render Dashboard > New > Blueprint > aponte para este repositório.
#
# IMPORTANTE (leia antes de publicar): o backend roda visão computacional
# (YOLOv8 + ByteTrack + mediapipe/opencv) por câmera conectada — isso é pesado
# de CPU/RAM. O plano "free" abaixo sobe a API, autenticação, billing e painel
# admin sem problema, mas o streaming de câmeras reais provavelmente exige um
# plano pago (mais RAM/CPU, sem "sleep" por inatividade). Ajuste `plan` conforme
# a carga esperada.
services:
  - type: web
    name: visionsaas-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    # O segundo comando é necessário por causa de um conflito real de pacotes:
    # `mediapipe` exige `opencv-contrib-python` e `ultralytics` exige
    # `opencv-python` (ambos hard dependencies, confirmado via `pip show`) —
    # então o `pip install` normal acaba instalando TRÊS distribuições de
    # opencv (headless + python + contrib-python) no mesmo ambiente. As três
    # escrevem pra dentro do mesmo pacote `cv2/`, então a que instalar por
    # último "vence" e sobrescreve os arquivos das outras — de forma
    # não-determinística (depende da ordem de resolução do pip). As variantes
    # não-headless linkam contra bibliotecas gráficas do sistema (libGL etc.)
    # que o runtime Python do Render não tem, então se uma delas "vencer" o
    # `import cv2` pode falhar/travar bem no início — antes do uvicorn
    # conseguir abrir a porta (sintoma observado: build OK, mas "Port scan
    # timeout" no deploy). O `--force-reinstall --no-deps` garante que
    # `opencv-python-headless` (a variante que o app realmente precisa, sem
    # nenhuma dependência de biblioteca gráfica) seja sempre a versão final
    # em disco, não importa a ordem de instalação anterior.
    buildCommand: pip install -r requirements.txt && pip install --force-reinstall --no-deps "opencv-python-headless>=4.9.0.80"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # Banco: provisionado automaticamente a partir do recurso `databases`
      # abaixo — nenhuma ação manual, o Render injeta a connection string.
      - key: DATABASE_URL
        fromDatabase:
          name: visionsaas-db
          property: connectionString
      # Gerado automaticamente pelo Render no primeiro deploy (chave aleatória forte).
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Preencha manualmente no Dashboard do Render (Environment) após o primeiro deploy —
      # `sync: false` = "não gerar, não commitar no blueprint, eu preencho depois".
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_UNICO
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: visionsaas-db
    plan: free
    databaseName: visionsaas
    user: visionsaas
