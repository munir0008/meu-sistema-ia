<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Sistema IA</title>
    <script>
      // Aplica o tema salvo (ou a preferência do SO) antes do primeiro paint,
      // evitando o "flash" de tema errado enquanto o React ainda não montou.
      (function () {
        var salvo = localStorage.getItem("visionsaas:theme");
        var escuro = salvo ? salvo === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", escuro);
        document.documentElement.style.colorScheme = escuro ? "dark" : "light";
      })();
    </script>
  </head>
  <body class="bg-neutral-50 dark:bg-neutral-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
